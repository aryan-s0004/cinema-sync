server.port=${SERVER_PORT:8080}
spring.application.name=cinemasync

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cinemasync_db}
spring.data.mongodb.database=${MONGODB_DATABASE:cinemasync_db}
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework=INFO
logging.level.com.cinemasync=${APP_LOG_LEVEL:INFO}
